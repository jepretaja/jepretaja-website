org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Cloudinary (pengganti Firebase Storage) ---
# Dapatkan dari dashboard Cloudinary:
#   CLOUDINARY_CLOUD_NAME  : Dashboard > Product Environment > Cloud name
#   CLOUDINARY_UPLOAD_PRESET: Settings > Upload > Upload presets > (buat preset
#                             baru dengan Signing Mode = Unsigned)
# Kalau dikosongkan, aplikasi tetap ter-build tapi upload media akan menolak
# dengan pesan yang menjelaskan konfigurasi mana yang belum diisi.
CLOUDINARY_CLOUD_NAME=dzqbjuda4
CLOUDINARY_UPLOAD_PRESET=cf070f90-5482-408d-954b-81700899d3fd

# Alamat panel web JepretAja (tanpa garis miring di akhir).
# Di sinilah endpoint booking & pembayaran (/api/app) berjalan. Tanpa ini,
# membuat booking dan membayar gagal dengan pesan "Alamat server belum diatur".
#
# --- Mode tes lokal (sekarang) ---
# Menunjuk ke dev server Vite di laptop (npm run dev di C:\jepretaja_admin).
# Syarat supaya bisa dijangkau dari HP/emulator:
#   1. Jalankan dev server dengan `npm run dev` — vite.config.js sudah diatur
#      host: true, jadi ia mendengarkan di semua alamat jaringan, bukan cuma
#      localhost.
#   2. HP harus satu jaringan Wi-Fi dengan laptop.
#   3. Izinkan port 5173 di Windows Firewall bila diminta.
# Kalau IP laptop berubah (pindah Wi-Fi / hotspot), perbarui baris ini lalu
# build ulang APK — nilainya ditanam saat kompilasi, bukan dibaca saat runtime.
#
# Untuk EMULATOR Android, ganti IP di bawah dengan 10.0.2.2 (alamat khusus
# yang menunjuk localhost laptop dari dalam emulator):
#   API_BASE_URL=http://10.0.2.2:5173
#
# --- Backend production di Vercel ---
API_BASE_URL=https://jepretaja-admin.vercel.app
